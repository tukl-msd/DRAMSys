[project]
name = "dramsys"
version = "0.1.0"
description = "DRAMSys utility Python scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaleido>=1.3.0",
    "polars>=1.43.1",
    "pyvcd>=0.4.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
extensions = ["dramsys-extensions"]

[tool.uv.build-backend]
module-name = "dramsys.simulation"

[tool.uv.sources]
dramsys-extensions = { path = "../extensions/python", editable = true }

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
